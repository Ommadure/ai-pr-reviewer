# Production on one VM (ADR 0015, docs/deploy.md): Caddy (HTTPS) → API. The background
# worker runs inside the API process, with Postgres (Neon, external over TLS) as its job
# queue (ADR 0016).
#
#   deploy/oracle/deploy.sh      # build + (re)start; links .env -> .env.production
#
# Secrets live in deploy/oracle/.env.production on the VM (never committed).

name: reviewpilot

services:
  api:
    build: ../../backend
    image: reviewpilot-backend:latest
    env_file: .env.production
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" } # logs can't fill the disk
    # One API container: migrating on start can't race, and the scheduled maintenance
    # jobs run exactly once (ADR 0016). Only Caddy can reach it:
    # it's on the compose network and never published, so trusting proxy headers is safe.
    command: >-
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    expose: ["8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s # migrations run first
    # The API and the worker share this: two reviews with LLM prompts in flight.
    mem_limit: 512m

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80" # Let's Encrypt HTTP challenge + redirect to HTTPS
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/oracle/.env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates survive restarts (Let's Encrypt rate limits)
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
