# Local development stack: `docker compose up --build`
#   api     http://localhost:8000/api/v1/health   (docs at /docs)
# The API runs the background worker in-process, with Postgres as the job queue (ADR 0016).
# Secrets come from backend/.env (optional in Phase 0); DATABASE_URL below overrides the
# localhost value in that file so the container reaches Postgres.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reviewpilot
      POSTGRES_PASSWORD: reviewpilot
      POSTGRES_DB: reviewpilot
    ports:
      # Host port 5433 so it doesn't clash with a locally installed PostgreSQL on 5432.
      # Containers still reach it as postgres:5432 on the compose network.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewpilot -d reviewpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://reviewpilot:reviewpilot@postgres:5432/reviewpilot
    depends_on:
      postgres:
        condition: service_healthy
    # Apply migrations, then serve with auto-reload on source changes.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
