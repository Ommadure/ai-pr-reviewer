name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a previous run on the same branch when new commits arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Integration tests run against real Postgres (upserts, ON CONFLICT, migrations).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reviewpilot
          POSTGRES_PASSWORD: reviewpilot
          POSTGRES_DB: reviewpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reviewpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://reviewpilot:reviewpilot@localhost:5432/reviewpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app tests
      - name: Test
        # No GitHub or LLM calls: GitHub is mocked with respx, APP_ENV=test is set in conftest.
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
