# Weekly update PRs, so fixes for audited vulnerabilities arrive without anyone watching.
#
# Major versions of the packages below are ignored: in September 2026 merging them one PR
# at a time broke main (react-dom 19 beside react 18, TypeScript 7 before typescript-eslint
# supported it). Upgrade those deliberately, together, in one PR. Minor and patch updates (security fixes included) still arrive, grouped, so one
# weekly PR per ecosystem replaces a pile of single-package ones.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # React 19 and react-router 8 (which requires React 19) are one migration.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-router
        update-types: ["version-update:semver-major"]
      # Waits for typescript-eslint to support it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Tracks the Node version we run (CI 24), not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # react and react-dom must always be the same version: never update one alone.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
