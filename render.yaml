# Render Blueprint: the ReviewPilot backend (ADR 0014, docs/deploy.md).
#
#   reviewpilot-api     web, free plan: webhooks + dashboard API; runs migrations on start
#   reviewpilot-worker  background worker (paid): Celery reviews + the ONE beat scheduler
#
# Postgres is Neon and Redis is Upstash (both external, both TLS), so nothing here
# expires or needs its own database service. Secrets marked `sync: false` are asked
# for once, when the Blueprint is first created.

services:
  - type: web
    name: reviewpilot-api
    runtime: docker
    plan: free
    region: singapore # nearest to India; put Neon and Upstash in ap-southeast-1 too
    rootDir: backend # only backend changes redeploy the backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # One instance, so migrating on start can't race. --proxy-headers: Render's proxy
    # terminates TLS; trust its X-Forwarded-* so request URLs say https.
    dockerCommand: >-
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass # deploy only commits whose CI passed
    envVars:
      - fromGroup: reviewpilot-shared

  - type: worker
    name: reviewpilot-worker
    runtime: docker
    plan: 0.5c-512mb # background workers have no free plan
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # -B embeds celery beat in this worker. Keep numInstances at 1: every extra
    # instance would be a second beat, and every scheduled job would run twice.
    # The --without-* flags turn off multi-worker chatter that only costs Redis commands.
    dockerCommand: >-
      celery -A app.workers.celery_app worker -B -s /tmp/celerybeat-schedule
      -Q reviews,default,feedback --concurrency 2
      --without-heartbeat --without-gossip --without-mingle --loglevel INFO
    numInstances: 1
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: reviewpilot-shared
      # The API's health URL; the always-on worker pings it every 10 minutes so the
      # free API never sleeps through a webhook. Leave empty on a paid API plan.
      - key: KEEP_WARM_URL
        sync: false

envVarGroups:
  - name: reviewpilot-shared
    envVars:
      - key: APP_ENV
        value: production
      # The dashboard's public origin (the Vercel URL). The OAuth callback goes through
      # it, so the session cookie is first-party (ADR 0012).
      - key: APP_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Neon's connection string exactly as shown (sslmode/channel_binding are converted).
      - key: DATABASE_URL
        sync: false
      # Upstash: rediss://default:<password>@<host>:6379 (TLS, certificate verified).
      - key: REDIS_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY_B64
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_SLUG
        value: reviewpilot-om
      - key: SESSION_SECRET
        generateValue: true # random 256-bit value, generated by Render
      # Must be a Fernet key (URL-safe base64); generate it locally, see docs/deploy.md.
      - key: ENCRYPTION_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite # the Phase 6 eval pick (evals/RESULTS.md)
      - key: GEMINI_API_KEY
        sync: false
      - key: USD_TO_INR
        value: "83"
      # Redis command budget (ADR 0014): 30 s idle poll, no Flower events.
      - key: CELERY_POLL_SECONDS
        value: "30"
      - key: CELERY_TASK_EVENTS
        value: "false"
      - key: REVIEW_MAX_CONCURRENT_LLM_CALLS
        value: "2"
      # Optional: errors to Sentry (scrubbed, see app/core/observability.py).
      - key: SENTRY_DSN
        sync: false
