id: py-resource-leak-01
language: python
description: SQLite connection opened per call and never closed
title: Audit log
planted_bugs:
- path: app/audit/log.py
  lines:
  - 7
  - 7
  category: bug
  severity: medium
  description: 'Connection is never closed: one leaked handle per audited request'
  accept_categories:
  - performance
  # Production, 2026-09-27: the reviewer "fixed" this leak with `with sqlite3.connect(...)`,
  # which never closes the connection (see py-sqlite-with-leak-01).
  bad_suggestions:
  - '(?s)\A(?!.*(?:\.close\(|closing\())(?=.*\bwith\s+sqlite3\.connect\()'
